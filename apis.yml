name: Jarmin
description: >-
  Jarmin is a Y Combinator-backed company building autonomous "AI employees" for
  technical and operational roles — ML engineers, financial analysts, account
  executives, compliance analysts, data analysts, project managers, and paralegals.
  Rather than a single chatbot, Jarmin operates a system of proprietary agents,
  models, and automations that learn a role's responsibilities, connect to a
  company's internal systems and data sources, experiment with approaches, and run
  end-to-end workflows autonomously (with optional human approval at key decision
  points). For ML work this spans domain-specific feature engineering, model
  selection under constraints, hyperparameter optimization, and deploying production
  pipelines. Founded by engineers from Meta, Apple, AWS, Lockheed Martin, and
  JPMorgan Chase, Jarmin targets investment banking, fintech, and legal verticals.
  This profile was surfaced as a Y Combinator portfolio lead; at enrichment time
  Jarmin publishes no public developer API, SDKs, or API documentation surface.
